name: backend-miniapp-template
services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app_template}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs first}
            POSTGRES_DB: app_template
        ports:
            - '127.0.0.1:15432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U app_template -d app_template']
            interval: 3s
            timeout: 3s
            retries: 20
volumes:
    postgres-data:
